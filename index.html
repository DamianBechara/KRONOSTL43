<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard de Participantes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#96c0fa;
  --secondary:#660014;
  --gold:#ebb866;
  --bg-0:#0d0410;
  --bg-1:#1a0a1f;
  --bg-2:#240b2a;
  --text:#f5f0f5;
  --muted:#b9a8be;
  --green:#4CAF50;
  --yellow:#ffc94a;
  --red:#e53935;
  --card:rgba(255,255,255,0.04);
  --card-border:rgba(235,184,102,0.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Inter',sans-serif;color:var(--text);background:var(--bg-0);min-height:100vh;overflow-x:hidden}
body{
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(150,192,250,.18), transparent 60%),
    radial-gradient(900px 500px at 95% 0%, rgba(102,0,20,.55), transparent 65%),
    radial-gradient(800px 600px at 50% 110%, rgba(235,184,102,.12), transparent 60%),
    linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 60%, var(--bg-2) 100%);
}

.header{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(18px);
  background:linear-gradient(90deg, rgba(102,0,20,.85), rgba(26,10,31,.75));
  border-bottom:1px solid rgba(235,184,102,.25);
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.header-inner{
  max-width:1400px;margin:0 auto;padding:22px 32px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:48px;height:48px;border-radius:14px;
  background:linear-gradient(135deg,var(--gold),#f7d99a);
  display:grid;place-items:center;color:var(--secondary);font-weight:800;font-size:22px;
  box-shadow:0 0 24px rgba(235,184,102,.45),inset 0 0 12px rgba(255,255,255,.3);
}
.title{font-size:22px;font-weight:700;letter-spacing:.3px}
.subtitle{font-size:12px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.header-stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.stat{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(235,184,102,.2);
  padding:10px 18px;border-radius:14px;min-width:110px;
  box-shadow:inset 0 0 12px rgba(150,192,250,.08);
}
.stat-label{font-size:10px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase}
.stat-value{font-size:20px;font-weight:700;color:var(--gold);text-shadow:0 0 12px rgba(235,184,102,.4)}

.connection{
  display:flex;align-items:center;gap:8px;
  font-size:11px;letter-spacing:1px;text-transform:uppercase;
  padding:8px 14px;border-radius:999px;
  background:rgba(255,255,255,.04);border:1px solid rgba(235,184,102,.25);
}
.connection .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 10px var(--yellow);animation:pulse 1.4s infinite}
.connection.ok .dot{background:var(--green);box-shadow:0 0 10px var(--green);animation:none}
.connection.err .dot{background:var(--red);box-shadow:0 0 10px var(--red);animation:none}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.refresh{
  cursor:pointer;background:rgba(235,184,102,.12);border:1px solid rgba(235,184,102,.4);
  color:var(--gold);font-weight:600;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
  padding:8px 14px;border-radius:999px;transition:all .25s;
}
.refresh:hover{background:rgba(235,184,102,.22);box-shadow:0 0 16px rgba(235,184,102,.4)}

.container{max-width:1400px;margin:0 auto;padding:32px}
.section-title{
  font-size:13px;letter-spacing:2px;text-transform:uppercase;
  color:var(--gold);margin-bottom:18px;display:flex;align-items:center;gap:10px;
}
.section-title::before{content:"";width:24px;height:2px;background:var(--gold);box-shadow:0 0 12px var(--gold)}

.grid{
  display:grid;gap:24px;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
}

.card{
  position:relative;
  background:linear-gradient(155deg, rgba(255,255,255,.06), rgba(102,0,20,.18));
  border:1px solid var(--card-border);
  border-radius:22px;
  padding:22px;
  overflow:hidden;
  transition:transform .35s ease, box-shadow .35s ease, border-color .35s ease;
  box-shadow:0 8px 28px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
  opacity:0;animation:fadeIn .5s forwards;
}
@keyframes fadeIn{to{opacity:1}}
.card:hover{
  transform:translateY(-6px);
  border-color:rgba(235,184,102,.55);
  box-shadow:0 14px 40px rgba(102,0,20,.55), 0 0 32px rgba(235,184,102,.18);
}

.card-head{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.avatar{
  width:64px;height:64px;border-radius:18px;flex-shrink:0;
  background:linear-gradient(135deg, rgba(150,192,250,.4), rgba(102,0,20,.6));
  border:1.5px solid rgba(235,184,102,.4);
  display:grid;place-items:center;
  color:var(--gold);font-size:24px;font-weight:700;
  box-shadow:0 0 20px rgba(150,192,250,.25), inset 0 0 14px rgba(0,0,0,.3);
  background-size:cover;background-position:center;
}
.avatar.placeholder::after{content:"👤";font-size:26px}
.head-info{flex:1;min-width:0}
.name{font-size:17px;font-weight:700;color:#fff;letter-spacing:.2px;line-height:1.2;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta-row{display:flex;flex-wrap:wrap;gap:6px}
.meta-tag{
  font-size:10px;letter-spacing:.5px;
  background:rgba(255,255,255,.05);border:1px solid rgba(235,184,102,.18);
  padding:3px 8px;border-radius:8px;color:var(--muted);
}
.meta-tag b{color:var(--primary);font-weight:600;margin-left:4px}

.badge{
  position:absolute;top:18px;right:18px;
  font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;
  padding:6px 12px;border-radius:999px;
  display:flex;align-items:center;gap:6px;
}
.badge.ok{background:rgba(76,175,80,.15);color:var(--green);border:1px solid rgba(76,175,80,.4);box-shadow:0 0 14px rgba(76,175,80,.25)}
.badge.risk{background:rgba(255,201,74,.12);color:var(--yellow);border:1px solid rgba(255,201,74,.45);box-shadow:0 0 14px rgba(255,201,74,.25)}
.badge.late{background:rgba(229,57,53,.12);color:var(--red);border:1px solid rgba(229,57,53,.45);box-shadow:0 0 14px rgba(229,57,53,.3)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}

.pillars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pillar{
  background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.05);
  border-radius:14px;padding:12px;
  transition:border-color .25s;
}
.pillar:hover{border-color:rgba(235,184,102,.35)}
.pillar-label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.pillar-icon{font-size:11px;color:var(--gold)}
.pillar-value{font-size:20px;font-weight:700;color:#fff;margin-bottom:6px;line-height:1}
.pillar-value small{font-size:11px;color:var(--muted);margin-left:3px;font-weight:500}

.bar{height:6px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;position:relative}
.bar-fill{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg, var(--primary), var(--gold));
  box-shadow:0 0 10px rgba(235,184,102,.5);
  transition:width .8s cubic-bezier(.2,.8,.2,1);
}
.bar-fill.green{background:linear-gradient(90deg,#7be084,var(--green));box-shadow:0 0 10px rgba(76,175,80,.5)}
.bar-fill.yellow{background:linear-gradient(90deg,#ffe18a,var(--yellow));box-shadow:0 0 10px rgba(255,201,74,.5)}
.bar-fill.red{background:linear-gradient(90deg,#ff8a87,var(--red));box-shadow:0 0 10px rgba(229,57,53,.5)}

.cat-tag{
  display:inline-block;font-size:10px;letter-spacing:.8px;font-weight:600;
  padding:4px 10px;border-radius:8px;margin-top:4px;
}
.cat-progress{background:rgba(150,192,250,.15);color:var(--primary);border:1px solid rgba(150,192,250,.4)}
.cat-cumplido{background:rgba(76,175,80,.15);color:var(--green);border:1px solid rgba(76,175,80,.4)}
.cat-legendario{background:rgba(102,0,20,.4);color:#ffb3c0;border:1px solid rgba(255,179,192,.5)}
.cat-guardian{background:linear-gradient(135deg,rgba(235,184,102,.25),rgba(235,184,102,.1));color:var(--gold);border:1px solid rgba(235,184,102,.6);box-shadow:0 0 10px rgba(235,184,102,.3)}

.alert-box{
  margin-top:6px;padding:10px 12px;border-radius:12px;
  font-size:11px;display:flex;align-items:center;gap:8px;
  background:rgba(0,0,0,.25);border:1px dashed rgba(235,184,102,.25);
  color:var(--muted);
}
.alert-box.active{background:rgba(229,57,53,.1);border:1px solid rgba(229,57,53,.45);color:#ffb3b1}
.alert-box.ok{background:rgba(76,175,80,.08);border:1px solid rgba(76,175,80,.35);color:#b8e6bb}
.alert-box::before{content:"⚠";font-size:13px}
.alert-box.ok::before{content:"✓"}

.notice{
  display:none;background:rgba(229,57,53,.1);border:1px solid rgba(229,57,53,.4);
  color:#ffb3b1;padding:14px 18px;border-radius:14px;margin-bottom:24px;font-size:13px;
}
.notice.show{display:block}
.notice b{color:var(--gold)}

@media (max-width:1100px){.grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}}
@media (max-width:760px){
  .container{padding:20px 16px}
  .header-inner{padding:16px 20px}
  .pillars{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:1fr;gap:18px}
  .title{font-size:18px}
}

.footer{text-align:center;color:var(--muted);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;margin:40px 0 24px}
.glow-line{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto;width:80%;max-width:600px;box-shadow:0 0 14px var(--gold);margin-bottom:32px;opacity:.55}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="logo">★</div>
      <div>
        <div class="title">Dashboard de Participantes</div>
        <div class="subtitle">Programa de Desarrollo y Liderazgo</div>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat"><div class="stat-label">Participantes</div><div class="stat-value" id="kpi-total">—</div></div>
      <div class="stat"><div class="stat-label">Avance promedio</div><div class="stat-value" id="kpi-avg">—</div></div>
      <div class="stat"><div class="stat-label">Cumplidos</div><div class="stat-value" id="kpi-cumplidos">—</div></div>
      <div class="stat"><div class="stat-label">Alertas</div><div class="stat-value" id="kpi-alertas">—</div></div>
      <div class="connection" id="conn"><span class="dot"></span><span id="conn-text">Conectando…</span></div>
      <button class="refresh" onclick="loadAndRender()">↻ Actualizar</button>
    </div>
  </div>
</header>

<div class="glow-line"></div>

<main class="container">
  <div id="notice" class="notice"></div>
  <div class="section-title">Vista general · participantes</div>
  <div class="grid" id="grid"></div>
  <div class="footer">© Programa de Liderazgo · Datos en vivo desde Google Sheets</div>
</main>

<script>
/* ============================================================
   CONFIG · Google Sheets (CSV publicado)
   - Para cambiar la hoja, vuelve a "Archivo → Compartir → Publicar en la web"
     y selecciona la hoja DASHBOARD_BASE específicamente.
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSn6OXdmiwGXvvHXf8Q53LCssIqfyhVAs1yXUCGmKdPXXZM8ye8McaNz1VnO5rqmbEY2n8IoPtQXhke/pub?gid=84323714&single=true&output=csv";

/* === Parser CSV robusto === */
function parseCSV(text){
  const rows=[]; let row=[],cell="",inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}
      else if(c==='"'){inQ=false;}
      else cell+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){row.push(cell);cell="";}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell="";}
      else if(c==='\r'){}
      else cell+=c;
    }
  }
  if(cell.length||row.length){row.push(cell);rows.push(row);}
  return rows;
}

const toPct = v => {
  if(v==null||v==="") return 0;
  let s=v.toString().trim().replace(",",".");
  if(s.endsWith("%")) return (parseFloat(s)||0)/100;
  const n=parseFloat(s);
  if(isNaN(n)) return 0;
  return n>1 ? n/100 : n;
};
const clean = v => (v==null?"":v.toString().trim());

/* === Fetch + parse === */
async function fetchSheet(){
  const url = SHEET_CSV_URL + (SHEET_CSV_URL.includes("?")?"&":"?") + "_t=" + Date.now();
  const r = await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const txt = await r.text();
  const rows = parseCSV(txt).filter(r=>r.length>1 || (r[0]&&r[0].trim()));
  if(rows.length===0) throw new Error("Hoja vacía");

  // localizar encabezados
  let headerIdx = rows.findIndex(r =>
    r.some(c=>/nombre/i.test(c||"")) &&
    r.some(c=>/(metas|enrol|legado|equipo|total)/i.test(c||""))
  );
  if(headerIdx<0) headerIdx = rows.findIndex(r => r.some(c=>/nombre/i.test(c||"")));
  if(headerIdx<0) throw new Error("No se encontraron columnas reconocidas. Publica la hoja DASHBOARD_BASE.");

  const headers = rows[headerIdx].map(h=>(h||"").trim().toLowerCase());
  const findCol = (...keys) => {
    for(const k of keys){
      const i = headers.findIndex(h => h.includes(k.toLowerCase()));
      if(i>=0) return i;
    } return -1;
  };
  const cols = {
    id:        findCol("id"),
    foto:      findCol("foto"),
    nombre:    findCol("nombre"),
    angel:     findCol("ángel","angel"),
    contrato:  findCol("contrato"),
    salto:     findCol("salto"),
    metas:     findCol("metas"),
    enrol:     findCol("enrol"),
    legado:    findCol("legado"),
    equipo:    findCol("equipo"),
    total:     findCol("total"),
    categoria: findCol("categor"),
    estado:    findCol("estado"),
    alertas:   findCol("alert"),
  };

  const data = [];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r = rows[i];
    const nombre = clean(r[cols.nombre]);
    const id = clean(r[cols.id]);
    if(!nombre && !id) continue;
    if(/kpi|grupo|promedio|total enrolad|participantes/i.test(nombre)) continue;
    data.push({
      id, foto:clean(r[cols.foto]),
      nombre: nombre || id || "(sin nombre)",
      angel:    clean(r[cols.angel])    || "—",
      contrato: clean(r[cols.contrato]) || "—",
      salto:    clean(r[cols.salto])    || "—",
      metas:  toPct(r[cols.metas]),
      enrol:  toPct(r[cols.enrol]),
      legado: toPct(r[cols.legado]),
      equipo: toPct(r[cols.equipo]),
      total:  toPct(r[cols.total]),
      categoria: clean(r[cols.categoria]) || "En progreso",
      estado:    clean(r[cols.estado])    || "En riesgo",
      alertas:   clean(r[cols.alertas])   || "",
    });
  }
  return data;
}

/* === Render === */
const pct = v => Math.round((v||0)*100)+"%";
const barClass = v => v>=0.8?"green":v>=0.4?"":v>=0.2?"yellow":"red";
const catClass = c => {
  const k=(c||"").toLowerCase();
  if(k.includes("guard")) return "cat-guardian";
  if(k.includes("legend")) return "cat-legendario";
  if(k.includes("cumpl")) return "cat-cumplido";
  return "cat-progress";
};
const enrolFromCat = (c,p) => {
  const k=(c||"").toLowerCase();
  if(k.includes("guard")) return "4+";
  if(k.includes("legend")) return 3;
  if(k.includes("cumpl")) return 2;
  return Math.round((p||0)*2);
};
const estadoBadge = e => {
  const s=(e||"").toLowerCase();
  if(s.includes("cumpl")) return {cls:"ok",txt:"OK"};
  if(s.includes("atras")) return {cls:"late",txt:"Atrasado"};
  if(s.includes("aten") || s.includes("riesg")) return {cls:"risk",txt:"En riesgo"};
  if(s.includes("progres")) return {cls:"risk",txt:"En progreso"};
  return {cls:"risk",txt:e||"En riesgo"};
};

function render(data){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  data.forEach((p,i)=>{
    const b = estadoBadge(p.estado);
    const isAlert = p.alertas && (p.alertas.startsWith("⚠") || /atras|falta|baja/i.test(p.alertas));
    const isOk = p.alertas && p.alertas.startsWith("✓");
    const alertCls = isAlert?"active":(isOk?"ok":"");
    const alertTxt = p.alertas || "Sin alertas";
    const photoStyle = p.foto ? `background-image:url('${p.foto}');` : "";
    const placeholder = p.foto ? "" : "placeholder";
    const card = document.createElement("article");
    card.className = "card";
    card.style.animationDelay = (i*30)+"ms";
    card.innerHTML = `
      <span class="badge ${b.cls}">${b.txt}</span>
      <div class="card-head">
        <div class="avatar ${placeholder}" style="${photoStyle}"></div>
        <div class="head-info">
          <div class="name">${p.nombre}</div>
          <div class="meta-row">
            <span class="meta-tag">Ángel<b>${p.angel}</b></span>
            <span class="meta-tag">Contrato<b>${p.contrato}</b></span>
            <span class="meta-tag">Salto<b>${p.salto}</b></span>
          </div>
        </div>
      </div>
      <div class="pillars">
        <div class="pillar">
          <div class="pillar-label">Metas <span class="pillar-icon">◆</span></div>
          <div class="pillar-value">${pct(p.metas)}</div>
          <div class="bar"><div class="bar-fill ${barClass(p.metas)}" style="width:${(p.metas||0)*100}%"></div></div>
        </div>
        <div class="pillar">
          <div class="pillar-label">Enrolamiento <span class="pillar-icon">◆</span></div>
          <div class="pillar-value">${enrolFromCat(p.categoria,p.enrol)}<small>enrolados</small></div>
          <span class="cat-tag ${catClass(p.categoria)}">${p.categoria}</span>
        </div>
        <div class="pillar">
          <div class="pillar-label">Legado <span class="pillar-icon">◆</span></div>
          <div class="pillar-value">${pct(p.legado)}</div>
          <div class="bar"><div class="bar-fill ${barClass(p.legado)}" style="width:${(p.legado||0)*100}%"></div></div>
        </div>
        <div class="pillar">
          <div class="pillar-label">Equipo <span class="pillar-icon">◆</span></div>
          <div class="pillar-value">${pct(p.equipo)}</div>
          <div class="bar"><div class="bar-fill ${barClass(p.equipo)}" style="width:${(p.equipo||0)*100}%"></div></div>
        </div>
      </div>
      <div class="alert-box ${alertCls}">${alertTxt}</div>
    `;
    grid.appendChild(card);
  });

  const avg = data.length ? data.reduce((a,b)=>a+(b.total||0),0)/data.length : 0;
  document.getElementById("kpi-total").textContent = data.length;
  document.getElementById("kpi-avg").textContent = pct(avg);
  document.getElementById("kpi-cumplidos").textContent = data.filter(d=>(d.estado||"").toLowerCase().includes("cumpl")).length;
  document.getElementById("kpi-alertas").textContent = data.filter(d=>(d.alertas||"").startsWith("⚠")).length;
}

function setStatus(state, text){
  const el = document.getElementById("conn");
  el.classList.remove("ok","err");
  if(state==="ok") el.classList.add("ok");
  if(state==="err") el.classList.add("err");
  document.getElementById("conn-text").textContent = text;
}

function showNotice(msg){
  const n = document.getElementById("notice");
  n.innerHTML = msg;
  n.classList.add("show");
}
function hideNotice(){document.getElementById("notice").classList.remove("show");}

async function loadAndRender(){
  setStatus("loading","Conectando…");
  hideNotice();
  try{
    const data = await fetchSheet();
    if(!data.length){
      setStatus("err","Sin datos");
      showNotice("La hoja se conectó pero <b>no hay filas reconocibles</b>. Asegúrate de publicar la hoja <b>DASHBOARD_BASE</b>.");
      render([]);
      return;
    }
    setStatus("ok","Conectado");
    render(data);
  } catch(e){
    setStatus("err","Sin conexión");
    showNotice(`No se pudo cargar la hoja: <b>${e.message}</b>. Verifica que esté publicada (Archivo → Compartir → Publicar en la web → seleccionar hoja <b>DASHBOARD_BASE</b>).`);
    render([]);
  }
}

loadAndRender();
</script>
</body>
</html>
